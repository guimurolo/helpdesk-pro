
      - name: Criar tabelas do banco
        run: python -m database.init_db

      - name: Criar pasta de relatorios
        run: mkdir -p reports

      - name: Executar testes unitarios
        run: >
          python -m pytest -m unit -v
          --html=reports/relatorio-unitarios.html
          --self-contained-html

      - name: Executar testes de integracao
        run: >
          python -m pytest -m integration -v
          --html=reports/relatorio-integracao.html
          --self-contained-html

      - name: Publicar relatorios de QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-qa-helpdesk-pro
          path: reports/
          if-no-files-found: warn
