
name: HelpDesk Pro - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helpdesk_user
          POSTGRES_PASSWORD: helpdesk123
          POSTGRES_DB: helpdesk_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk_user -d helpdesk_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: helpdesk_db
      DB_USER: helpdesk_user
      DB_PASSWORD: helpdesk123

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Criar tabelas do banco
        run: python -m database.init_db

      - name: Criar pasta de relatorios
        run: mkdir -p reports

      - name: Executar testes unitarios
        run: >
          python -m pytest -m unit -v
          --html=reports/relatorio-unitarios.html
          --self-contained-html

      - name: Executar testes de integracao
        run: >
          python -m pytest -m integration -v
          --html=reports/relatorio-integracao.html
          --self-contained-html

      - name: Publicar relatorios de QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-qa-helpdesk-pro
          path: reports/
          if-no-files-found: warn